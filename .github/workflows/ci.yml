name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check ironclad nedster_agent tests
      - run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel --outdir "${{ runner.temp }}/wheelhouse"
      - name: Install wheel into a fresh venv outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          if [ -x "$RUNNER_TEMP/smoke-venv/bin/python" ]; then
            VPY="$RUNNER_TEMP/smoke-venv/bin/python"; VBIN="$RUNNER_TEMP/smoke-venv/bin/nedster"
          else
            VPY="$RUNNER_TEMP/smoke-venv/Scripts/python.exe"; VBIN="$RUNNER_TEMP/smoke-venv/Scripts/nedster.exe"
          fi
          "$VPY" -m pip install "$RUNNER_TEMP"/wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$VBIN" --help
          "$VBIN" doctor --plain || true
