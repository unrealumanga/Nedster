[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nedster-agent"
version = "3.1.0a2"
description = "Persistent local AI coding agent for Ollama with project RAG, sandboxed tools, web research, and a concise terminal UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "unrealumanga" }]
keywords = [
  "ai-agent", "local-ai", "local-llm", "coding-agent", "coding-assistant",
  "ollama", "ollama-agent", "qwen", "terminal-ui", "cli", "developer-tools", "software-development",
  "autonomous-agent", "privacy", "self-hosted-ai", "agentic-coding", "tool-use",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "rich>=13.9,<15",
  "textual>=1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/unrealumanga/Nedster"
Repository = "https://github.com/unrealumanga/Nedster"
Issues = "https://github.com/unrealumanga/Nedster/issues"

[project.scripts]
nedster = "nedster_agent.cli:main"

[tool.setuptools.packages.find]
include = ["nedster_agent*", "ironclad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
