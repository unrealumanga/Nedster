[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nedster-agent"
version = "4.0.0a1"
description = "Local coding agent for Ollama that saves your Claude Code / Codex tokens: brief in, tested diff out"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "unrealumanga" }]
keywords = [
  "coding-agent", "local-llm", "ollama", "claude-code", "codex", "token-saving", "ai-coding-assistant",
  "agentic-coding", "open-weights", "qwen", "offline-ai", "self-hosted-ai", "developer-tools", "cli", "terminal-ui",
  "tool-use", "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "rich>=13.9,<15",
  "textual>=1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/unrealumanga/Nedster"
Repository = "https://github.com/unrealumanga/Nedster"
Issues = "https://github.com/unrealumanga/Nedster/issues"
Documentation = "https://github.com/unrealumanga/Nedster/blob/main/docs/USAGE.md"
"Use with Claude Code" = "https://github.com/unrealumanga/Nedster#use-it-with-claude-code"

[project.scripts]
nedster = "nedster_agent.cli:main"

[tool.setuptools.packages.find]
include = ["nedster_agent*", "ironclad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
